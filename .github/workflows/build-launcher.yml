name: FLIN RP Android launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-launcher.yml'
      - 'source/**'
      - 'tools/**'
      - 'libsamp.so'
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Direct HTTPS URL to the original Flinity APK or ZIP (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  source-readiness:
    if: github.event_name == 'push' || inputs.source_url == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check launcher source package
        run: |
          if find source -type f \\( -name '*.apk' -o -name '*.zip' \\) -print -quit 2>/dev/null | grep -q .; then
            echo 'Source package is present.'
          else
            echo 'Flinity source package is not stored in this repository.'
            echo 'This job is a readiness check; it does not claim to build an APK.'
          fi
      - name: Publish readiness report
        run: |
          mkdir -p work
          {
            echo '# FLIN RP launcher readiness'
            echo
            echo '- Server target: 195.18.27.226:3146'
            echo '- Native library inspection runs separately.'
            echo '- No modified APK is claimed by this readiness job.'
          } > work/readiness.md
      - uses: actions/upload-artifact@v4
        with:
          name: FLIN-RP-readiness
          path: work/readiness.md

  inspect-native:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.source_url == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ELF inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils
      - name: Inspect FLIN RP libsamp.so
        run: |
          set -euo pipefail
          test -s libsamp.so || { echo 'libsamp.so is missing or empty'; exit 1; }
          mkdir -p work
          file libsamp.so | tee work/native-file.txt
          python3 tools/inspect_native.py libsamp.so | tee work/native-report.md
          readelf -d libsamp.so > work/native-dynamic.txt
          readelf -Ws libsamp.so > work/native-symbols.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FLIN-RP-native-inspection
          path: |
            work/native-report.md
            work/native-file.txt
            work/native-dynamic.txt
            work/native-symbols.txt

  inspect-flinity-source:
    if: github.event_name == 'workflow_dispatch' && inputs.source_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source package
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$SOURCE_URL" -o /tmp/source.bin
          mkdir -p work/original
          if unzip -t /tmp/source.bin >/dev/null 2>&1; then
            unzip -q /tmp/source.bin -d work/original
          else
            cp /tmp/source.bin work/original.apk
          fi
      - name: Locate APK
        run: |
          set -euo pipefail
          APK="$(find work/original -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            ROOT="$(find work/original -type f -name AndroidManifest.xml -printf '%h\\n' -quit)"
            test -n "$ROOT" || { echo 'No APK or AndroidManifest.xml found'; exit 1; }
            (cd "$ROOT" && zip -qr "$GITHUB_WORKSPACE/work/flinity-original.apk" .)
            APK="$GITHUB_WORKSPACE/work/flinity-original.apk"
          fi
          cp "$APK" work/input.apk
      - name: Decode and inspect package
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          apktool d -f work/input.apk -o work/decoded
          python3 tools/inspect_package.py work/decoded | tee work/inspection.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FLIN-RP-flinity-inspection
          path: work/inspection.txt
          if-no-files-found: ignore
