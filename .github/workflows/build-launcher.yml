name: FLIN RP Android launcher

on:
  push:
    branches:
      - main
    paths:
      - 'libsamp.so'
      - 'tools/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FLIN RP repository
        uses: actions/checkout@v4

      - name: Install ELF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file

      - name: Check native library
        run: |
          set -euo pipefail
          if [ ! -s libsamp.so ]; then
            echo 'ERROR: libsamp.so is missing or empty.'
            exit 1
          fi
          mkdir -p work
          file libsamp.so | tee work/native-file.txt
          python3 tools/inspect_native.py libsamp.so | tee work/native-report.md
          readelf -d libsamp.so > work/native-dynamic.txt
          readelf -Ws libsamp.so > work/native-symbols.txt

      - name: Upload native inspection report
        uses: actions/upload-artifact@v4
        with:
          name: FLIN-RP-native-inspection
          path: |
            work/native-report.md
            work/native-file.txt
            work/native-dynamic.txt
            work/native-symbols.txt
