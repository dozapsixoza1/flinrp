<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Привет</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#7c3aed}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
    body{background:linear-gradient(180deg,#071028 0%, #07121b 100%);display:flex;align-items:center;justify-content:center;padding:20px;color:#e6eef8}
    .card{width:100%;max-width:760px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:16px;padding:36px;box-shadow:0 8px 30px rgba(2,6,23,0.7);border:1px solid rgba(255,255,255,0.03);text-align:center}
    h1{font-size:48px;margin:0 0 8px;line-height:1;color:linear-gradient(90deg,#fff, #cfe7ff)}
    p{margin:0 0 20px;color:rgba(230,238,248,0.8)}
    .greet{display:inline-block;padding:10px 18px;background:linear-gradient(90deg, rgba(124,58,237,0.15), rgba(99,102,241,0.08));border-radius:999px;border:1px solid rgba(124,58,237,0.18);backdrop-filter:blur(4px)}
    .actions{display:flex;gap:12px;justify-content:center;margin-top:16px}
    button{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:10px 14px;border-radius:10px;color:inherit;font-weight:600;cursor:pointer}
    .btn-primary{background:linear-gradient(90deg,var(--accent),#4f46e5);color:#fff;border:none;box-shadow:0 6px 18px rgba(124,58,237,0.16)}
    footer{margin-top:22px;color:rgba(230,238,248,0.6);font-size:13px}
    @media (max-width:480px){h1{font-size:34px}}
  </style>
</head>
<body>
  <main class="card">
    <h1>Привет!</h1>
    <div class="greet">
      <p style="margin:0;font-size:18px">Добро пожаловать на ваш дефолтный сайт — всё готово.</p>
    </div>

    <div class="actions">
      <button onclick="document.querySelector('h1').textContent='Привет, мир!'">Изменить заголовок</button>
      <button class="btn-primary" onclick="alert('Готово — можно редактировать файл index.html')">ОК</button>
    </div>

    <footer>Откройте этот файл в браузере или разместите на хостинге. Хотите добавить форму или меню?</footer>
  </main>
  <script>
    // Небольшая интерактивность
    document.addEventListener('keydown', e=>{
      if(e.key === 'h' || e.key === 'H') document.querySelector('h1').textContent = 'Хай!';
    });
  </script>
</body>
</html>
